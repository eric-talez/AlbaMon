name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches, but let pushes to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Unit, live RLS, production browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next.js build cache, per node_modules/next/dist/docs CI guide.
      # Keyed so source changes rebuild from the closest prior cache.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # Diffing HEAD against git's empty tree makes `git diff --check` scan
      # every tracked text file for whitespace errors (trailing whitespace,
      # space-before-tab, blank lines at EOF), not just uncommitted changes.
      - name: Whitespace check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start isolated disposable Supabase
        # Start/status can print local credentials. Keep output out of job logs.
        run: supabase start > /dev/null

      - name: Reset isolated local database
        run: supabase db reset --local

      - name: Live database authorization matrix
        run: npm run test:db

      - name: Local transactional email provider double and signed webhook
        run: npm run test:notifications:local

      - name: Set local public test environment
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const status = JSON.parse(execFileSync('supabase', ['status', '-o', 'json'], { encoding: 'utf8' }));
          if (status.API_URL !== 'http://127.0.0.1:55321' || !status.ANON_KEY) {
            throw new Error('Expected isolated disposable Supabase');
          }
          appendFileSync(process.env.GITHUB_ENV,
            `NEXT_PUBLIC_SUPABASE_URL=${status.API_URL}\nNEXT_PUBLIC_SUPABASE_ANON_KEY=${status.ANON_KEY}\n`);
          NODE

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build against local database
        run: npm run build

      - name: Production browser and anonymous REST checks
        # Playwright owns Next start and shuts it down after the tests.
        run: npm run test:e2e

      - name: Stop isolated disposable Supabase
        if: always()
        run: supabase stop --no-backup
